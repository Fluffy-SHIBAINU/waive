<svg xmlns="http://www.w3.org/2000/svg" width="650" height="268" viewBox="0 0 650 268" font-family="Arial, Helvetica, sans-serif" font-size="16" role="img">
<title>Policy events that create natural experiments, and challenge dates</title>
<desc>A vertical timeline from July 2024 to 2028-29. Filled circles are policy events: Oregon starts presumptive eligibility in July 2024, California AB 1312 takes effect in January 2026, H.R. 9504 is reported in July 2026, and California screening starts in July 2027. Squares are AHRQ challenge dates in December 2026 and February 2027. The hollow circle is expected: the first filings for a full treated year in 2028 to 2029.</desc>
<rect width="650" height="268" fill="#ffffff"/>
<line x1="106" y1="24" x2="106" y2="252" stroke="#9CA3AF" stroke-width="2"/>

<text x="92" y="41" text-anchor="end" font-weight="bold" fill="#111827">Jul 2024</text>
<circle cx="106" cy="36" r="7" fill="#0B5D4B"/>
<text x="124" y="41" fill="#111827">Oregon starts presumptive eligibility</text>

<text x="92" y="75" text-anchor="end" font-weight="bold" fill="#111827">Jan 2026</text>
<circle cx="106" cy="70" r="7" fill="#0B5D4B"/>
<text x="124" y="75" fill="#111827">California AB 1312 takes effect</text>

<text x="92" y="109" text-anchor="end" font-weight="bold" fill="#111827">Jul 2026</text>
<circle cx="106" cy="104" r="7" fill="#0B5D4B"/>
<text x="124" y="109" fill="#111827">H.R. 9504 reported by Ways and Means, 25–15</text>

<text x="92" y="143" text-anchor="end" font-weight="bold" fill="#111827">Dec 2026</text>
<rect x="100" y="132" width="12" height="12" fill="#6B7280"/>
<text x="124" y="143" fill="#111827">AHRQ announces Phase 1 winners (Dec 1)</text>

<text x="92" y="177" text-anchor="end" font-weight="bold" fill="#111827">Feb 2027</text>
<rect x="100" y="166" width="12" height="12" fill="#6B7280"/>
<text x="124" y="177" fill="#111827">AHRQ Phase 2 submissions due (Feb 2)</text>

<text x="92" y="211" text-anchor="end" font-weight="bold" fill="#111827">Jul 2027</text>
<circle cx="106" cy="206" r="7" fill="#0B5D4B"/>
<text x="124" y="211" fill="#111827">California screening starts; six states in force</text>

<text x="92" y="245" text-anchor="end" font-weight="bold" fill="#111827">2028–29</text>
<circle cx="106" cy="240" r="6" fill="#ffffff" stroke="#0B5D4B" stroke-width="2" stroke-dasharray="3 2"/>
<text x="124" y="245" fill="#111827">First filings for a full treated year (expected)</text>
</svg>
