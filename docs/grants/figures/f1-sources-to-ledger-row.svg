<svg xmlns="http://www.w3.org/2000/svg" width="650" height="392" viewBox="0 0 650 392" font-family="Arial, Helvetica, sans-serif" font-size="16" role="img">
<title>From public sources to a hospital ledger row</title>
<desc>Five public sources feed two processing steps. The steps feed one ledger row per hospital with four layers: says, delivered, does and serves. The ledger produces open outputs.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#374151"/></marker>
</defs>
<rect width="650" height="392" fill="#ffffff"/>
<text x="6" y="20" font-weight="bold" fill="#111827">Public sources</text>
<text x="290" y="20" font-weight="bold" fill="#111827">Process</text>
<text x="478" y="20" font-weight="bold" fill="#111827">Ledger</text>

<rect x="6" y="34" width="244" height="50" rx="4" fill="#F3F4F6" stroke="#4B5563"/>
<text x="16" y="55" font-weight="bold" fill="#111827">Hospital policy documents</text>
<text x="16" y="75" fill="#374151">what it says</text>

<rect x="6" y="92" width="244" height="50" rx="4" fill="#F3F4F6" stroke="#4B5563"/>
<text x="16" y="113" font-weight="bold" fill="#111827">Patient decision letters</text>
<text x="16" y="133" fill="#374151">pilot, enums only</text>

<rect x="6" y="150" width="244" height="50" rx="4" fill="#F3F4F6" stroke="#4B5563"/>
<text x="16" y="171" font-weight="bold" fill="#111827">IRS Form 990, Schedule H</text>
<text x="16" y="191" fill="#374151">charity care, collections</text>

<rect x="6" y="208" width="244" height="50" rx="4" fill="#F3F4F6" stroke="#4B5563"/>
<text x="16" y="229" font-weight="bold" fill="#111827">Medicare cost reports</text>
<text x="16" y="249" fill="#374151">Worksheet S-10</text>

<rect x="6" y="266" width="244" height="50" rx="4" fill="#F3F4F6" stroke="#4B5563"/>
<text x="16" y="287" font-weight="bold" fill="#111827">CMS and Census files</text>
<text x="16" y="307" fill="#374151">who is served</text>

<rect x="290" y="34" width="146" height="108" rx="4" fill="#E6F2EF" stroke="#0B5D4B"/>
<text x="300" y="60" font-weight="bold" fill="#0B3B31">Read and verify</text>
<text x="300" y="84" fill="#0B3B31">one exact quote</text>
<text x="300" y="106" fill="#0B3B31">per field</text>

<rect x="290" y="150" width="146" height="166" rx="4" fill="#E6F2EF" stroke="#0B5D4B"/>
<text x="300" y="176" font-weight="bold" fill="#0B3B31">Join by hospital</text>
<text x="300" y="200" fill="#0B3B31">CCN, EIN, ZIP</text>
<text x="300" y="222" fill="#0B3B31">match method,</text>
<text x="300" y="244" fill="#0B3B31">confidence kept</text>

<rect x="478" y="34" width="166" height="282" rx="6" fill="#ffffff" stroke="#0B5D4B" stroke-width="2"/>
<text x="561" y="58" text-anchor="middle" font-weight="bold" fill="#111827">Ledger row</text>
<text x="561" y="80" text-anchor="middle" fill="#374151">one per hospital</text>
<rect x="490" y="100" width="142" height="44" rx="4" fill="#E6F2EF" stroke="#0B5D4B"/>
<text x="561" y="128" text-anchor="middle" font-weight="bold" fill="#0B3B31">Says</text>
<rect x="490" y="152" width="142" height="44" rx="4" fill="#E6F2EF" stroke="#0B5D4B"/>
<text x="561" y="180" text-anchor="middle" font-weight="bold" fill="#0B3B31">Delivered</text>
<rect x="490" y="204" width="142" height="44" rx="4" fill="#E6F2EF" stroke="#0B5D4B"/>
<text x="561" y="232" text-anchor="middle" font-weight="bold" fill="#0B3B31">Does</text>
<rect x="490" y="256" width="142" height="44" rx="4" fill="#E6F2EF" stroke="#0B5D4B"/>
<text x="561" y="284" text-anchor="middle" font-weight="bold" fill="#0B3B31">Serves</text>

<line x1="250" y1="59" x2="288" y2="59" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="250" y1="117" x2="288" y2="117" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="250" y1="175" x2="288" y2="175" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="250" y1="233" x2="288" y2="233" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="250" y1="291" x2="288" y2="291" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="436" y1="122" x2="476" y2="122" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="436" y1="232" x2="476" y2="232" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="561" y1="316" x2="561" y2="332" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="6" y="334" width="638" height="44" rx="4" fill="#0B5D4B"/>
<text x="325" y="362" text-anchor="middle" fill="#ffffff">Open outputs: CC BY 4.0 data, Apache-2.0 code, methods note</text>
</svg>
