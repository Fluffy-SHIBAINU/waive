[project]
name = "waive"
version = "0.1.0"
description = "Hospital financial assistance for seniors, from a photo of the bill."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "openai>=1.40",
  "tavily-python>=0.5",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pillow>=10.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pytest-socket>=0.8.1",
]

[project.scripts]
waive = "waive.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live' --disable-socket --allow-unix-socket"
markers = ["live: calls real external APIs and spends credits"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Plans and specs under docs/ contain code blocks that must stay as written.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is handled by `ruff format`; pydantic generics use typing.Generic on purpose.
ignore = ["E501", "UP046", "UP047"]
