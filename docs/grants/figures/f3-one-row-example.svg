<svg xmlns="http://www.w3.org/2000/svg" width="650" height="366" viewBox="0 0 650 366" font-family="Arial, Helvetica, sans-serif" font-size="16" role="img">
<title>One ledger row for Baystate Medical Center with sources and dates</title>
<desc>A five-row table. Says: free care up to 150 percent of the federal poverty level and no collection actions before day 120. Does: charity care 0.42 percent of expenses and bad debt 0.56 percent; collection actions not extracted. Serves: 8,067 Medicare inpatients, 35.0 percent dual-eligible. Delivered: no outcomes recorded yet.</desc>
<rect width="650" height="366" fill="#ffffff"/>
<rect x="0" y="0" width="650" height="30" fill="#0B5D4B"/>
<text x="10" y="21" font-weight="bold" fill="#ffffff">Layer</text>
<text x="100" y="21" font-weight="bold" fill="#ffffff">What the row shows</text>
<text x="400" y="21" font-weight="bold" fill="#ffffff">Source and date</text>

<rect x="0" y="30" width="650" height="74" fill="#ffffff"/>
<text x="10" y="54" font-weight="bold" fill="#0B3B31">Says</text>
<text x="100" y="54" fill="#111827">Free care to 150% of FPL</text>
<text x="100" y="74" fill="#111827">(state Health Safety Net);</text>
<text x="100" y="94" fill="#111827">no collection before day 120</text>
<text x="400" y="54" fill="#111827">Hospital policy PDFs,</text>
<text x="400" y="74" fill="#111827">checked 2026-10-02</text>

<rect x="0" y="104" width="650" height="74" fill="#F3F4F6"/>
<text x="10" y="128" font-weight="bold" fill="#0B3B31">Does</text>
<text x="100" y="128" fill="#111827">Charity care $7.34M, 0.42% of</text>
<text x="100" y="148" fill="#111827">expenses (1.20% in 2010);</text>
<text x="100" y="168" fill="#111827">bad debt $9.69M, 0.56%</text>
<text x="400" y="128" fill="#111827">Form 990, Schedule H, via</text>
<text x="400" y="148" fill="#111827">Community Benefit Insight;</text>
<text x="400" y="168" fill="#111827">tax year ending 2023-09</text>

<rect x="0" y="178" width="650" height="54" fill="#ffffff"/>
<text x="10" y="202" font-weight="bold" fill="#0B3B31">Does</text>
<text x="100" y="202" fill="#111827">Collection actions (Schedule H,</text>
<text x="100" y="222" font-weight="bold" fill="#854F0B">Part V, line 19): not extracted</text>
<text x="400" y="202" fill="#111827">IRS e-file XML (planned)</text>

<rect x="0" y="232" width="650" height="74" fill="#F3F4F6"/>
<text x="10" y="256" font-weight="bold" fill="#0B3B31">Serves</text>
<text x="100" y="256" fill="#111827">8,067 Medicare inpatients;</text>
<text x="100" y="276" fill="#111827">35.0% dual-eligible; 54.3%</text>
<text x="100" y="296" fill="#111827">aged 75 or older</text>
<text x="400" y="256" fill="#111827">CMS, Medicare inpatient</text>
<text x="400" y="276" fill="#111827">files by provider, 2024</text>

<rect x="0" y="306" width="650" height="54" fill="#ffffff"/>
<text x="10" y="330" font-weight="bold" fill="#0B3B31">Delivered</text>
<text x="100" y="330" font-weight="bold" fill="#854F0B">No outcomes recorded yet</text>
<text x="400" y="330" fill="#111827">Waive learning loop,</text>
<text x="400" y="350" fill="#111827">tested in simulation only</text>

<line x1="0" y1="360" x2="650" y2="360" stroke="#0B5D4B" stroke-width="2"/>
</svg>
