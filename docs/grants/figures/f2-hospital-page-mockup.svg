<svg xmlns="http://www.w3.org/2000/svg" width="650" height="452" viewBox="0 0 650 452" font-family="Arial, Helvetica, sans-serif" font-size="16" role="img">
<title>Mock-up of a ledger hospital page for Baystate Medical Center</title>
<desc>A mock-up page with four panels: what the hospital says in its policy, what it does according to its tax filings, whom it serves among Medicare inpatients, and what patients report. The outcomes panel is empty because no real outcomes have been recorded.</desc>
<rect width="650" height="452" fill="#ffffff"/>
<rect x="2" y="2" width="646" height="448" fill="#ffffff" stroke="#6B7280" stroke-width="1.5"/>
<rect x="3" y="3" width="644" height="47" fill="#F3F4F6"/>
<text x="14" y="24" font-weight="bold" fill="#111827">Baystate Medical Center</text>
<text x="14" y="44" fill="#374151">CCN 220077 · Springfield, MA · sheet v5</text>
<rect x="540" y="11" width="98" height="28" rx="4" fill="#FAEEDA" stroke="#854F0B"/>
<text x="589" y="31" text-anchor="middle" font-weight="bold" fill="#633806">MOCK-UP</text>

<rect x="12" y="60" width="310" height="166" rx="4" fill="#ffffff" stroke="#9CA3AF"/>
<text x="22" y="82" font-weight="bold" fill="#0B3B31">Says: policy text</text>
<text x="22" y="106" fill="#111827">Free care to 150% of FPL</text>
<text x="22" y="128" font-style="italic" fill="#4B5563">(state Health Safety Net)</text>
<text x="22" y="150" fill="#111827">No collection before day 120</text>
<text x="22" y="172" fill="#111827">Apply within 240 days</text>
<text x="22" y="204" font-style="italic" fill="#4B5563">Quotes and sources on click</text>

<rect x="330" y="60" width="308" height="166" rx="4" fill="#ffffff" stroke="#9CA3AF"/>
<text x="340" y="82" font-weight="bold" fill="#0B3B31">Does: tax filings</text>
<text x="340" y="106" fill="#111827">Charity care 0.42% of expenses</text>
<polyline points="342.0,117.2 356.8,123.3 371.7,118.9 386.5,130.1 401.3,128.2 416.2,123.0 431.0,122.0 445.8,125.9 460.7,128.3 475.5,129.5 490.3,133.3 505.2,134.2 520.0,134.5" fill="none" stroke="#0B5D4B" stroke-width="2"/>
<circle cx="520" cy="134.5" r="3.5" fill="#0B5D4B"/>
<text x="340" y="166" fill="#111827">2010 to 2022: 1.20% to 0.42%</text>
<text x="340" y="190" fill="#111827">Bad debt 0.56% of expenses</text>
<text x="340" y="214" font-weight="bold" fill="#854F0B">Collections: not extracted</text>

<rect x="12" y="234" width="310" height="132" rx="4" fill="#ffffff" stroke="#9CA3AF"/>
<text x="22" y="256" font-weight="bold" fill="#0B3B31">Serves: Medicare, 2024</text>
<text x="22" y="280" fill="#111827">8,067 Medicare inpatients</text>
<text x="22" y="302" fill="#111827">35.0% dual-eligible</text>
<rect x="22" y="310" width="282" height="10" fill="#E5E7EB"/>
<rect x="22" y="310" width="98.7" height="10" fill="#0B5D4B"/>
<text x="22" y="346" fill="#111827">54.3% aged 75 or older</text>

<rect x="330" y="234" width="308" height="132" rx="4" fill="#ffffff" stroke="#9CA3AF"/>
<text x="340" y="256" font-weight="bold" fill="#0B3B31">Delivered: patient outcomes</text>
<text x="340" y="282" font-weight="bold" fill="#854F0B">No real outcomes yet</text>
<text x="340" y="304" fill="#111827">Approved, denied and days</text>
<text x="340" y="326" fill="#111827">will appear once recorded</text>

<text x="14" y="392" fill="#111827">Caution: Massachusetts reimburses free care through the</text>
<text x="14" y="412" fill="#111827">Health Safety Net, so a low hospital-funded share is not a</text>
<text x="14" y="432" fill="#111827">compliance finding. Layout is a proposal; values: Figure 3.</text>
</svg>
